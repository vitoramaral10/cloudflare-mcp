<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
  <title id="t">find accuracy, top 5</title>
  <desc id="d">Share of requests whose operation find puts in the top 5, v0.7.0, hybrid search. English queries with Cloudflare terms: 100%. Portuguese requests rewritten in English by an LLM: set 1 96%, set 2 97%, set 3 93%. Raw Portuguese requests: set 1 76%, set 2 80%, set 3 63%.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6dff"/>
      <stop offset="1" stop-color="#2fc8f0"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="470" rx="18" fill="#0d1230"/>
  <g font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
    <text x="36" y="48" fill="#eef1ff" font-size="21" font-weight="700">find: operation in the top 5</text>
    <text x="36" y="74" fill="#8f9ad6" font-size="14.5">v0.7.0, hybrid search, holdout request sets (never used for tuning)</text>

    <!-- gridlines: x0 = 380, 100% = 960 -->
    <g stroke="#232b5c" stroke-width="1">
      <line x1="380" y1="100" x2="380" y2="372"/>
      <line x1="525" y1="100" x2="525" y2="372" stroke-dasharray="3 5"/>
      <line x1="670" y1="100" x2="670" y2="372" stroke-dasharray="3 5"/>
      <line x1="815" y1="100" x2="815" y2="372" stroke-dasharray="3 5"/>
      <line x1="960" y1="100" x2="960" y2="372" stroke-dasharray="3 5"/>
      <line x1="902" y1="96" x2="902" y2="376" stroke="#e8b86b" stroke-dasharray="6 4" stroke-width="1.5"/>
    </g>
    <g fill="#7681b8" font-size="12.5" text-anchor="middle">
      <text x="380" y="394">0%</text><text x="525" y="394">25%</text><text x="670" y="394">50%</text><text x="815" y="394">75%</text><text x="960" y="394">100%</text>
    </g>
    <text x="902" y="92" fill="#e8b86b" font-size="12.5" text-anchor="middle">90%</text>

    <!-- English -->
    <text x="36" y="125" fill="#cfd6ff" font-size="15" font-weight="600">English, Cloudflare terms</text>
    <text x="360" y="125" fill="#8f9ad6" font-size="13.5" text-anchor="end">25 requests</text>
    <rect x="380" y="108" width="580" height="24" rx="5" fill="url(#g)"/>
    <text x="950" y="125" fill="#0b1026" font-size="14" font-weight="700" text-anchor="end">100%</text>

    <!-- Rewritten -->
    <text x="36" y="172" fill="#cfd6ff" font-size="15" font-weight="600">Portuguese, rewritten</text>
    <text x="36" y="192" fill="#8f9ad6" font-size="13">in English by an LLM</text>
    <g font-size="13.5">
      <text x="360" y="172" fill="#8f9ad6" text-anchor="end">set 1</text>
      <rect x="380" y="157" width="556.8" height="20" rx="5" fill="url(#g)" opacity="0.92"/>
      <text x="926" y="172" fill="#0b1026" font-weight="700" text-anchor="end">96%</text>
      <text x="360" y="200" fill="#8f9ad6" text-anchor="end">set 2</text>
      <rect x="380" y="185" width="562.6" height="20" rx="5" fill="url(#g)" opacity="0.92"/>
      <text x="932" y="200" fill="#0b1026" font-weight="700" text-anchor="end">97%</text>
      <text x="360" y="228" fill="#8f9ad6" text-anchor="end">set 3</text>
      <rect x="380" y="213" width="539.4" height="20" rx="5" fill="url(#g)" opacity="0.92"/>
      <text x="909" y="228" fill="#0b1026" font-weight="700" text-anchor="end">93%</text>
    </g>

    <!-- Raw -->
    <text x="36" y="290" fill="#cfd6ff" font-size="15" font-weight="600">Portuguese, raw</text>
    <text x="36" y="310" fill="#8f9ad6" font-size="13">as the user typed it</text>
    <g font-size="13.5">
      <text x="360" y="290" fill="#8f9ad6" text-anchor="end">set 1</text>
      <rect x="380" y="275" width="440.8" height="20" rx="5" fill="#4a55a8"/>
      <text x="830" y="290" fill="#cfd6ff" font-weight="700">76%</text>
      <text x="360" y="318" fill="#8f9ad6" text-anchor="end">set 2</text>
      <rect x="380" y="303" width="464" height="20" rx="5" fill="#4a55a8"/>
      <text x="853" y="318" fill="#cfd6ff" font-weight="700">80%</text>
      <text x="360" y="346" fill="#8f9ad6" text-anchor="end">set 3</text>
      <rect x="380" y="331" width="365.4" height="20" rx="5" fill="#4a55a8"/>
      <text x="754" y="346" fill="#cfd6ff" font-weight="700">63%</text>
    </g>

    <text x="36" y="440" fill="#7681b8" font-size="13">Sets 1–3: 25, 30 and 30 requests. The model calling find is asked to write the query in English, which is the rewritten case.</text>
  </g>
</svg>

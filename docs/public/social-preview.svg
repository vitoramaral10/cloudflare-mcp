<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6dff"/>
      <stop offset="1" stop-color="#2fc8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a3570" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b1026"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(110 170) scale(2.3)">
    <rect width="128" height="128" rx="28" fill="#111733" stroke="#273063" stroke-width="1"/>
    <path d="M34 92 H93 A19 19 0 0 0 96.5 54.4 A28 28 0 0 0 43 50.5 A21 21 0 0 0 34 92 Z"

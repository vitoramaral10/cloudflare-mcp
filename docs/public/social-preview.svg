    <g fill="none" stroke="#e8ecff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 60 Q51 60 51 66 V68 Q51 72 47 72 Q51 72 51 76 V78 Q51 84 58 84"/>
      <path d="M74 60 Q81 60 81 66 V68 Q81 72 85 72 Q81 72 81 76 V78 Q81 84 74 84"/>
    </g>
    <circle cx="66" cy="72" r="3.6" fill="#2fc8f0"/>
  </g>

  <g font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
    <text x="470" y="250" fill="#f2f4ff" font-size="76" font-weight="700" letter-spacing="-1">cloudflare-mcp</text>
    <text x="472" y="315" fill="#b9c2ee" font-size="31">The whole Cloudflare API as MCP tools,</text>
    <text x="472" y="357" fill="#b9c2ee" font-size="31">and a search that finds the right one.</text>

    <g font-size="23" font-weight="600">
      <rect x="472" y="408" width="232" height="48" rx="24" fill="#18204a" stroke="#34408a"/>
      <text x="588" y="440" fill="#cfd6ff" text-anchor="middle">3,777 operations</text>
      <rect x="720" y="408" width="170" height="48" rx="24" fill="#18204a" stroke="#34408a"/>
      <text x="805" y="440" fill="#cfd6ff" text-anchor="middle">find + call</text>
      <rect x="906" y="408" width="236" height="48" rx="24" fill="#18204a" stroke="#34408a"/>
      <text x="1024" y="440" fill="#cfd6ff" text-anchor="middle">Go · one binary</text>
    </g>
    <text x="472" y="520" fill="#7681b8" font-size="21">Unofficial · not affiliated with Cloudflare, Inc. · MIT</text>
